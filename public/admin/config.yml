backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "zadania"
    label: "Baza Zadań"
    folder: "content/zadania"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Tytuł Zadania", name: "title", widget: "string" }[cite: 1, 2]
      - { label: "Link do Zadania (Brainly)", name: "link", widget: "string" }[cite: 1, 2]
      - { label: "Kraj", name: "kraj", widget: "select", options: ["Polska"], default: "Polska" }[cite: 1, 2]
      - { label: "Przedmiot", name: "przedmiot", widget: "select", options: ["Matematyka", "Język Polski", "Chemia", "Fizyka", "Biologia", "Historia", "Geografia"] }[cite: 1, 2]
      - { label: "Klasa", name: "klasa", widget: "select", options: ["Klasa 4", "Klasa 5", "Klasa 6", "Klasa 7", "Klasa 8", "Klasa 1 LO", "Klasa 2 LO", "Klasa 3 LO", "Klasa 4 LO"] }[cite: 1, 2]
      - { label: "Kategoria / Temat", name: "kategoria", widget: "string", hint: "np. Ułamki, Sole, Dziady cz. II" }[cite: 1, 2]
      - { label: "Poziom Trudności", name: "poziom", widget: "select", options: ["Podstawowy", "Średni", "Master"] }[cite: 1, 2]
      - { label: "Dodatkowy Opis / Podpowiedź", name: "body", widget: "markdown", required: false }[cite: 1, 2]
