<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainlyHub — Global Education Search</title>
  
  <link rel="icon" type="image/png" href="assets/Brainly Hub.png" id="favicon" />
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>

  <div id="app">
    <div class="main-wrapper">
      <!-- Dynamic Global Header Component Container -->
      <header id="global-header"></header>

      <!-- Main Content Area -->
      <main class="content-body">
        <!-- Hero Search Section -->
        <section class="hero-search-card">
          <div class="hero-search-content">
            <div>
              <h1 class="hero-title">Database Knowledge Hub</h1>
              <p class="hero-subtitle">Search questions, exercise solutions, and educational materials globally</p>
            </div>

            <!-- Search Input Bar -->
            <div class="search-input-wrapper">
              <img src="assets/Search.png" alt="Search" class="search-field-icon" />
              <input type="text" id="main-search-input" placeholder="Type topic, equation, or prompt..." autocomplete="off" />
              <button class="btn-search-action" id="btn-execute-search">Search</button>
            </div>

            <!-- Filters Grid -->
            <div class="search-filters-grid">
              <div class="filter-group">
                <label class="filter-label" for="filter-market">Market / Region</label>
                <select id="filter-market" class="filter-select">
                  <option value="all">All Markets</option>
                  <option value="PL">PL — Poland</option>
                  <option value="US">US — United States</option>
                  <option value="RO">RO — Romania</option>
                  <option value="ES">ES — Spain</option>
                  <option value="BR">BR — Brazil</option>
                </select>
              </div>

              <div class="filter-group">
                <label class="filter-label" for="filter-difficulty">Education Level</label>
                <select id="filter-difficulty" class="filter-select">
                  <option value="all">All Levels</option>
                  <option value="primary">Primary School</option>
                  <option value="secondary">High School</option>
                  <option value="exam">Exam Prep / SAT</option>
                  <option value="higher">University / Advanced</option>
                </select>
              </div>

              <div class="filter-group">
                <label class="filter-label" for="filter-subject-select">Subject Category</label>
                <select id="filter-subject-select" class="filter-select">
                  <option value="all">All Subjects</option>
                  <option value="mathematics">Mathematics</option>
                  <option value="physics">Physics</option>
                  <option value="chemistry">Chemistry</option>
                  <option value="biology">Biology</option>
                  <option value="computer_science">Computer Science</option>
                  <option value="history">History</option>
                  <option value="geography">Geography</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <!-- Stats Counter Dashboard -->
        <section class="stats-dashboard-grid">
          <div class="stat-card">
            <span class="stat-value" id="stat-tasks">--</span>
            <span class="stat-label">Database Items</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-solutions">--</span>
            <span class="stat-label">Verified Answers</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-markets">--</span>
            <span class="stat-label">Active Markets</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-subjects">--</span>
            <span class="stat-label">Subjects</span>
          </div>
        </section>

        <!-- Search Results Grid -->
        <section class="liquid-card">
          <div class="settings-card-header">
            <h2 id="results-count-title">Database Search Results</h2>
          </div>
          <div id="bundles-results-grid" class="bundles-results-grid">
            <!-- Rendered dynamically -->
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Synchronized Component & Core Scripts -->
  <script src="components/header.js"></script>
  <script src="components/notifications.js"></script>
  <script src="components/profile.js"></script>
  <script src="components/favorites.js"></script>
  
  <script src="core/app.js"></script>
  <script src="core/sheets-db.js"></script>
</body>
</html>
